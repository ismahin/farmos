services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farmos
      POSTGRES_USER: farmos_migrator
      POSTGRES_PASSWORD: local-migrator-only
    ports:
      - "5432:5432"
    volumes:
      - farmos-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmos_migrator -d farmos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  farmos-postgres:
